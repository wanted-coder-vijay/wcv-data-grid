<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040"><title>Dynostack brand identity</title><rect width="1440" height="1040" fill="#090a0b"/><text x="70" y="68" font-family="Arial,sans-serif" font-size="18" fill="#9298a1">DYNOSTACK / BRAND SYSTEM</text><text x="70" y="120" font-family="Arial,sans-serif" font-size="35" fill="#f4f5f7">One identity. Room for what comes next.</text><path d="M70 156H1370" stroke="#292c2f"/><g transform="translate(80 245) scale(2)"><path d="M10 4H30C45 4 57 14 60 28H46C43 22 38 18 30 18H10Z" fill="#f4f5f7"/><path d="M10 50H30C38 50 43 46 46 40H60C57 54 45 64 30 64H10Z" fill="#f4f5f7"/><path d="M10 27H25L32 34L25 41H10Z" fill="#f4f5f7"/></g><text x="240" y="336" font-family="Arial,sans-serif" font-size="77" font-weight="700" letter-spacing="-4" fill="#f4f5f7">dynostack</text><text x="82" y="465" font-family="Arial,sans-serif" font-size="18" fill="#9298a1">The parent brand / a layered D with a forward signal.</text><g transform="translate(780 245) scale(2)"><path d="M10 4H30C45 4 57 14 60 28H46C43 22 38 18 30 18H10Z" fill="#f4f5f7"/><path d="M10 50H30C38 50 43 46 46 40H60C57 54 45 64 30 64H10Z" fill="#f4f5f7"/><path d="M10 23H19V32H10Z" fill="#f4f5f7"/><path d="M23 23H32V32H23Z" fill="#f4f5f7"/><path d="M10 36H19V45H10Z" fill="#f4f5f7"/><path d="M23 36H32V45H23Z" fill="#f4f5f7"/></g><text x="940" y="318" font-family="Arial,sans-serif" font-size="56" font-weight="700" letter-spacing="-3" fill="#f4f5f7">dynostack</text><text x="940" y="370" font-family="Arial,sans-serif" font-size="34" fill="#96baff">Grid</text><text x="782" y="465" font-family="Arial,sans-serif" font-size="18" fill="#9298a1">The first product / the same silhouette, a tiled core.</text><rect y="540" width="1440" height="500" fill="#fafafa"/><g transform="translate(100 665) scale(1.8)"><path d="M10 4H30C45 4 57 14 60 28H46C43 22 38 18 30 18H10Z" fill="#16181c"/><path d="M10 50H30C38 50 43 46 46 40H60C57 54 45 64 30 64H10Z" fill="#16181c"/><path d="M10 27H25L32 34L25 41H10Z" fill="#16181c"/></g><text x="245" y="740" font-family="Arial,sans-serif" font-size="66" font-weight="700" letter-spacing="-3" fill="#16181c">dynostack</text><g transform="translate(810 665) scale(1.8)"><path d="M10 4H30C45 4 57 14 60 28H46C43 22 38 18 30 18H10Z" fill="#16181c"/><path d="M10 50H30C38 50 43 46 46 40H60C57 54 45 64 30 64H10Z" fill="#16181c"/><path d="M10 23H19V32H10Z" fill="#16181c"/><path d="M23 23H32V32H23Z" fill="#16181c"/><path d="M10 36H19V45H10Z" fill="#16181c"/><path d="M23 36H32V45H23Z" fill="#16181c"/></g><text x="955" y="723" font-family="Arial,sans-serif" font-size="47" font-weight="700" letter-spacing="-2.5" fill="#16181c">dynostack</text><text x="955" y="773" font-family="Arial,sans-serif" font-size="32" fill="#525963">Grid</text><path d="M70 876H1370" stroke="#e2e4e7"/><text x="80" y="934" font-family="Arial,sans-serif" font-size="16" fill="#696e76">Small by design. Sharp at every size. SVG source, transparent background, light + dark variants.</text><g transform="translate(1130 930) scale(.5)"><path d="M10 4H30C45 4 57 14 60 28H46C43 22 38 18 30 18H10Z" fill="#16181c"/><path d="M10 50H30C38 50 43 46 46 40H60C57 54 45 64 30 64H10Z" fill="#16181c"/><path d="M10 27H25L32 34L25 41H10Z" fill="#16181c"/></g><g transform="translate(1200 925) scale(.65)"><path d="M10 4H30C45 4 57 14 60 28H46C43 22 38 18 30 18H10Z" fill="#16181c"/><path d="M10 50H30C38 50 43 46 46 40H60C57 54 45 64 30 64H10Z" fill="#16181c"/><path d="M10 23H19V32H10Z" fill="#16181c"/><path d="M23 23H32V32H23Z" fill="#16181c"/><path d="M10 36H19V45H10Z" fill="#16181c"/><path d="M23 36H32V45H23Z" fill="#16181c"/></g></svg>