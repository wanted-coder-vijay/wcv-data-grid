<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Meet Dynostack React Grid. Explore the live data table, customize every feature, and copy the configuration into your React app."
    />
    <meta name="theme-color" content="#090a0b" />
    <title>Dynostack — A growing toolkit for modern interfaces.</title>
    <link rel="icon" href="/favicon.svg" />
    <script>
      try {
        document.documentElement.dataset.mode =
          localStorage.getItem("dynostack-mode") === "light" ? "light" : "dark"
      } catch {
        document.documentElement.dataset.mode = "dark"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
