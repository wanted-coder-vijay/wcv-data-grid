<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- seo:start -->
    <title>Dynostack | React Grid and UI Tools</title>
    <meta name="description" content="Dynostack builds open-source tools for modern React interfaces. Explore Dynostack React Grid: editable data tables with filtering, theming and CSV export." />
    <!-- seo:end -->
    <meta name="theme-color" content="#090a0b" />
    <link rel="icon" href="/favicon.svg" />
    <script>
      try {
        document.documentElement.dataset.mode =
          localStorage.getItem("dynostack-mode") === "light" ? "light" : "dark"
      } catch {
        document.documentElement.dataset.mode = "dark"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
